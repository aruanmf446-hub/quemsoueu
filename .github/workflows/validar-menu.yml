name: Validar menu e capturas do Ateliê

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validar-menu.yml
      - index.html
      - 'src/**'
      - 'tests/**'
      - 'revisao/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-atelie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selecao:
    name: Seleção e prévias dos 34 personagens
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador e dependências
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund three@0.180.0 playwright
          npx playwright install --with-deps chromium
          sudo ln -sf "$(node -p "require('playwright').chromium.executablePath()")" /usr/bin/chromium
      - name: Servir e testar cartões, recuperação e celular
        run: |
          node tests/qualidade-expressao.mjs
          python3 -m http.server 8000 > /tmp/atelie-http.log 2>&1 &
          for tentativa in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ -o /dev/null; then break; fi
            sleep 1
          done
          timeout 28m node tests/selecao-personagens.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selecao-personagens
          path: renders/selecao-personagens/
  acabamento:
    name: Escultura, encaixes e GLB dos 34 personagens
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador e dependências
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund three@0.180.0 playwright
          npx playwright install --with-deps chromium
          sudo ln -sf "$(node -p "require('playwright').chromium.executablePath()")" /usr/bin/chromium
      - name: Conferir escultura, encaixes e animação
        run: |
          node tests/qualidade-cabelo.mjs
          node tests/qualidade-pelos-acessorios.mjs
          node tests/qualidade-palpebras-companheiros.mjs
          node tests/identidades-faciais.mjs
          node tests/continuidade-labios.mjs
          node tests/qualidade-queixos.mjs
          node tests/encaixe-pescoco.mjs
          node tests/encaixe-oculos.mjs
          node tests/qualidade-companheiros-esculpidos.mjs
      - name: Servir e conferir GLBs, recoloração e Worker
        run: |
          python3 -m http.server 8000 > /tmp/atelie-http.log 2>&1 &
          for tentativa in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ -o /dev/null; then break; fi
            sleep 1
          done
          timeout 25m node tests/pelos-exportacao.cjs
          node tests/galeria-reconstrucao.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acabamento-pelos-exportacao
          path: renders/pelos/exportacao/
          retention-days: 30

  menu:
    name: Prévias e subcategorias
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Three.js e Playwright para os testes
        run: npm install --no-save --package-lock=false --no-audit --no-fund three@0.180.0 playwright
      - name: Preparar Chromium
        run: |
          npx playwright install --with-deps chromium
          sudo ln -sf "$(node -p "require('playwright').chromium.executablePath()")" /usr/bin/chromium
      - name: Validar sintaxe e arquivos
        run: |
          node --check src/editor.js
          node --check src/previews.js
          node --check src/preview-spec.js
          node --check src/preview-worker.js
          node --check tests/menu-previas.cjs
      - name: Servir página estática
        run: |
          python3 -m http.server 8000 > /tmp/atelie-http.log 2>&1 &
          for tentativa in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/atelie-http.log
          exit 1
      - name: Testar miniaturas, navegação, cache, mobile e GLB
        run: timeout 48m node tests/menu-previas.cjs
      - name: Conferir aplicação dos tipos físicos e peso por toque e arraste
        run: |
          node tests/controles-corpo.cjs
          node tests/corpo-visivel.cjs
      - name: Conferir os personagens do Reino da Lua
        run: ATELIE_PERSONAGENS=paysandu_wolf,nana_explorer,moon_guardian,nico_inventor,ruby_sorceress,ruby_raven,flame_guardian node tests/refino-lotes.cjs reino-lua.cjs
      - name: Conferir os personagens da floresta
        run: ATELIE_PERSONAGENS=forest_archer_f,forest_archer_m,forest_guard_f,forest_guard_m,forest_guard_veteran,forest_artificer,forest_princess ATELIE_RENDERS=renders/floresta node tests/refino-lotes.cjs reino-lua.cjs
      - name: Conferir skins do deserto e montaria
        run: |
          node tests/deserto-identidades.mjs
          ATELIE_PERSONAGENS=frontier_cowboy,bread_baker,bread_vigilante,cactus_soldier,cactus_soldier_large,desert_fennec,cowboy_on_fennec ATELIE_RENDERS=renders/deserto node tests/refino-lotes.cjs reino-lua.cjs
      - name: Registrar resultado no GitHub Actions
        if: always()
        run: |
          {
            echo '## Teste do menu FIFA/PES'
            echo 'Cada subcategoria gera uma captura e um relatório detalhado.'
            if test -f renders/menu/relatorio.json; then
              node -e "const d=require('./renders/menu/relatorio.json'); console.log('Total de subcategorias:',d.reports.length,'| Prévia(s):',d.reports.reduce((n,r)=>n+r.previews,0),'| Cache:',d.cached,'| Clipes GLB:',d.glb?.animations)"
            else
              echo 'Relatório não criado: consultar logs e capturas parciais.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Disponibilizar capturas individuais e galeria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-menu-atelie
          path: |
            renders/menu/
            renders/controles-corpo/
            renders/reino-lua/
            renders/floresta/
            renders/deserto/
          if-no-files-found: warn
          retention-days: 30

  personagens:
    name: Personagens, câmeras e exportação GLB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências dos testes
        run: npm install --no-save --package-lock=false --no-audit --no-fund three@0.180.0 playwright
      - name: Preparar Chromium
        run: |
          npx playwright install --with-deps chromium
          sudo ln -sf "$(node -p "require('playwright').chromium.executablePath()")" /usr/bin/chromium
      - name: Servir aplicação
        run: |
          python3 -m http.server 8000 > /tmp/atelie-http.log 2>&1 &
          for tentativa in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Conferir os 34 personagens, roupas, rig e GLB
        run: |
          atelie_ids=$(node --input-type=module -e "import {PRESET_ORDER} from './src/presets.js'; process.stdout.write(PRESET_ORDER.join(','))")
          ATELIE_PERSONAGENS="$atelie_ids" timeout 48m node tests/refino-lotes.cjs visuais.cjs
      - name: Disponibilizar capturas de frente e 3/4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-personagens-atelie
          path: |
            renders/*.png
            renders/reports.json
          if-no-files-found: warn
          retention-days: 30

  malhas:
    name: Geometria, cores, cache e cobertura — ${{ matrix.grupo }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - grupo: originais-a
            ids: feminine_soft,masculine_soft,old_king,cute_round,feminine_bold,alchemist_villain,dwarf_bard
          - grupo: originais-b
            ids: sad_clown,orc_warrior,cactus_cowboy,pepper_king,chili_bandit,robot_ball
          - grupo: lua
            ids: nana_explorer,moon_guardian,nico_inventor,ruby_sorceress
          - grupo: floresta
            ids: forest_archer_f,forest_archer_m,forest_guard_f,forest_guard_m,forest_guard_veteran,forest_artificer,forest_princess
          - grupo: deserto
            ids: frontier_cowboy,bread_baker,bread_vigilante,cactus_soldier,cactus_soldier_large
          - grupo: companheiros-e-chama
            ids: paysandu_wolf,ruby_raven,desert_fennec,cowboy_on_fennec,flame_guardian
    env:
      ATELIE_PERSONAGENS: ${{ matrix.ids }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Three.js
        run: npm install --no-save --package-lock=false --no-audit --no-fund three@0.180.0
      - name: Conferir faces, normais, materiais, tipos e cache
        run: |
          set -o pipefail
          node tests/figurinos.mjs | tee figurinos-${{ matrix.grupo }}.log
      - name: Preservar relatório de geometria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometria-${{ matrix.grupo }}
          path: figurinos-${{ matrix.grupo }}.log
          retention-days: 30
