name: Publicar capturas do Ateliê

on:
  workflow_run:
    workflows: ["Validar menu e capturas do Ateliê"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  galeria:
    name: Galeria pública das capturas aprovadas
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Obter capturas das subcategorias
        uses: actions/download-artifact@v4
        with:
          name: capturas-menu-atelie
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: transferir/menu
      - name: Obter capturas dos personagens
        uses: actions/download-artifact@v4
        with:
          name: capturas-personagens-atelie
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: transferir/personagens
      - name: Publicar galeria em branch isolada, sem alterar a main
        run: |
          mkdir -p /tmp/capturas-atelie/menu /tmp/capturas-atelie/personagens
          cp -R transferir/menu/. /tmp/capturas-atelie/menu/
          cp -R transferir/personagens/. /tmp/capturas-atelie/personagens/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan capturas-atelie
          git rm -r -f . || true
          git clean -fdx
          cp -R /tmp/capturas-atelie/. .
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          imagens = sorted(Path('personagens').glob('*.png'))
          itens = ''.join('<article><a href="'+escape(p.name)+'"><img loading="lazy" src="'+escape(p.name)+'"></a><p>'+escape(p.stem.replace('-', ' · '))+'</p></article>' for p in imagens)
          estilo = '<style>body{background:#091522;color:#edf5fa;font:16px system-ui;margin:24px}a{color:#39e4df}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}article{background:#172b3a;padding:12px;border-radius:14px}img{max-width:100%;border-radius:8px}</style>'
          Path('personagens/index.html').write_text('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personagens do Ateliê</title>'+estilo+'<h1>Personagens — frente e 3/4</h1><p><a href="../index.html">Voltar à galeria</a></p><main>'+itens+'</main></html>',encoding='utf8')
          Path('index.html').write_text('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capturas do Ateliê</title>'+estilo+'<h1>Ateliê — capturas reais dos testes</h1><p><a href="menu/index.html">Menu: categorias, subcategorias e prévias</a></p><p><a href="personagens/index.html">13 personagens: frente e 3/4</a></p></html>',encoding='utf8')
          print('Imagens de personagens:',len(imagens),'| subcategorias:',len(list(Path('menu').glob('*.png'))))
          PY
          git add -f -A
          git commit -m "Publicar capturas aprovadas do Ateliê"
          git push --force origin HEAD:refs/heads/capturas-atelie
